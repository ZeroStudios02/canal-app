<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canal App · Música y Eventos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Canvas de fondo animado -->
  <canvas id="bgCanvas" class="bg-canvas"></canvas>

  <header class="header">
    <div class="logo">▶️ CANAL<span>APP</span></div>
    <div class="user">👤 Invitado</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="musica">🎵 Música</button>
    <button class="tab" data-tab="eventos">📅 Eventos</button>
  </nav>

  <main class="container">
    <section id="tab-musica" class="tab-panel active">
      <div class="section-header">
        <h2>Música</h2>
        <p class="subtitle">Tu biblioteca de sonido</p>
      </div>
      <div id="lista-musica" class="music-list"></div>
    </section>

    <section id="tab-eventos" class="tab-panel">
      <div class="section-header">
        <h2>Eventos</h2>
        <p class="subtitle">Próximos estrenos y actividades</p>
      </div>
      <div id="lista-eventos" class="events-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p>⚠️ Sube solo contenido que tengas derechos de compartir.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
